name: Build Fire TV app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Name it
        run: cp app/build/outputs/apk/release/app-release.apk kfdx-plus.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KFDX+ for Fire TV (build ${{ github.run_number }})
          files: kfdx-plus.apk
          make_latest: true
